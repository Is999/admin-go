# 运行期工作流配置样例；周期任务和归档任务只通过数据库草稿与发布快照管理。
workflows:
  # 用户标签工作流默认参数。
  user_tag:
    # 是否启用用户标签能力。
    enabled: false
    # 是否启用标签得失事件 hook 派发；未注册 hook 时保持关闭。
    event_hook_enabled: false
    # 默认工作流任务分片总数；小量数据从 1 开始，按吞吐需要再扩。
    default_shard_total: 1
    # 默认单批处理数量。
    default_batch_size: 2000
    # 节点内部 worker 默认值。
    default_worker_count: 4
    # 用户标签结果物理表数量，独立于 user，仅支持 1/2/4/.../1024。
    result_shard_total: 1
    # 标签差异解析批次大小。
    diff_batch_size: 10000
    # 事件 outbox 派发批次大小。
    event_batch_size: 500
