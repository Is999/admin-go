services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # Proxy 镜像可由 SHARDINGSPHERE_PROXY_IMAGE 覆盖；未设置时使用本地固定版本镜像。
    image: ${SHARDINGSPHERE_PROXY_IMAGE:-local/shardingsphere-proxy:5.5.3-mysql-8.4.0}
    restart: unless-stopped
    environment:
      IS_DOCKER: "true"
      # PROXY_JVM_OPTS 覆盖 JVM 启动参数；默认在发生 OOM 时终止进程，由 Compose 重启策略接管。
      JVM_OPTS: "${PROXY_JVM_OPTS:--XX:+ExitOnOutOfMemoryError}"
    ports:
      # PROXY_BIND_IP 和 PROXY_PORT 控制宿主机监听，默认仅绑定 127.0.0.1:3307，容器内端口固定为 3307。
      - "${PROXY_BIND_IP:-127.0.0.1}:${PROXY_PORT:-3307}:3307"
    volumes:
      - ./runtime/global.yaml:/opt/shardingsphere-proxy/conf/global.yaml:ro
      - proxy_logs:/opt/shardingsphere-proxy/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/3307'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    stop_grace_period: 90s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  management:
    profiles: ["management"]
    build:
      context: .
      dockerfile: Dockerfile
      target: management
    # 管理镜像可由 SHARDINGSPHERE_MANAGEMENT_IMAGE 覆盖；未设置时使用本地固定版本镜像。
    image: ${SHARDINGSPHERE_MANAGEMENT_IMAGE:-local/shardingsphere-management:5.5.3-mysql-8.4.0}
    restart: "no"
    environment:
      IS_DOCKER: "true"
      # 管理容器沿用 PROXY_JVM_OPTS；未设置时在发生 OOM 后直接退出且不会自动重启。
      JVM_OPTS: "${PROXY_JVM_OPTS:--XX:+ExitOnOutOfMemoryError}"
    ports:
      # MANAGEMENT_BIND_IP 和 MANAGEMENT_PORT 控制宿主机监听，默认仅绑定 127.0.0.1:3308，容器内端口固定为 3307。
      - "${MANAGEMENT_BIND_IP:-127.0.0.1}:${MANAGEMENT_PORT:-3308}:3307"
    volumes:
      - ./runtime/global.yaml:/opt/shardingsphere-proxy/conf/global.yaml:ro
      - proxy_management_logs:/opt/shardingsphere-proxy/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/3307'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    stop_grace_period: 90s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  proxy_logs:
  proxy_management_logs:
